<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aegent</title>
    <!-- T-P3-134 批 A：theme.css 由 style.css 头部 @import 引入（全站唯一取色处）；
         components.css = 组件类库（方案 §2.5 形态目录） -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/components.css" />
  </head>
  <body>
    <!-- 批 A 布局骨架（方案 §2.4）：左侧栏（导航组 + 底部状态区）+ 主内容
         路由容器。设置/用量/工作台/通知/历史/搜索迁出为 ui/views/*.js 页面
         模块（hash 路由——router.js），对话页为本骨架的默认视图。 -->
    <div id="app-shell">
      <aside id="sidebar" aria-label="主导航">
        <header class="sidebar-head">
          <span class="sidebar-brand">aegent</span>
          <button id="sidebar-toggle" type="button" data-i18n-title="折叠/展开侧栏" title="折叠/展开侧栏">«</button>
        </header>
        <nav class="sidebar-nav">
          <button id="chat-btn" class="nav-item active" type="button" data-route="chat" data-i18n-title="对话" title="对话">
            <span data-icon="chat"></span><span class="nav-label" data-i18n="对话">对话</span>
          </button>
          <button id="history-btn" class="nav-item" type="button" data-route="history" data-i18n-title="会话历史" title="会话历史">
            <span data-icon="history"></span><span class="nav-label" data-i18n="历史">历史</span>
          </button>
          <button id="search-btn" class="nav-item" type="button" data-route="search" data-i18n-title="跨会话搜索（Ctrl+Shift+F）" title="跨会话搜索（Ctrl+Shift+F）">
            <span data-icon="search"></span><span class="nav-label" data-i18n="搜索">搜索</span>
          </button>
          <button id="work-btn" class="nav-item" type="button" data-route="work" data-i18n-title="工作面板（文件/变更/子代理/协作）" title="工作面板（文件/变更/子代理/协作）">
            <span data-icon="work"></span><span class="nav-label" data-i18n="工作台">工作台</span>
          </button>
          <button id="usage-btn" class="nav-item" type="button" data-route="usage" data-i18n-title="用量与上下文" title="用量与上下文">
            <span data-icon="usage"></span><span class="nav-label" data-i18n="用量">用量</span>
          </button>
          <button id="notify-btn" class="nav-item" type="button" data-route="notify" data-i18n-title="通知中心" title="通知中心">
            <span data-icon="bell"></span><span class="nav-label" data-i18n="通知">通知</span><span id="notify-badge" class="nav-badge" hidden></span>
          </button>
        </nav>
        <div class="sidebar-foot">
          <select id="profile-quick" data-i18n-title="场景快速切换（Profiles）" title="场景快速切换（Profiles）" hidden></select>
          <div class="foot-status">
            <span id="conn-status">连接中…</span>
            <span id="surface-id"></span>
            <span id="lease-status"></span>
          </div>
          <div class="foot-actions">
            <button id="lease-btn" type="button" data-i18n="取得写租约" hidden>取得写租约</button>
            <button id="settings-btn" class="nav-item" type="button" data-route="settings" data-i18n-title="设置中心" title="设置中心">
              <span data-icon="settings"></span><span class="nav-label" data-i18n="设置">设置</span>
            </button>
          </div>
          <span class="foot-version">aegent v0.1.0</span>
        </div>
      </aside>
      <div id="main">
        <!-- 对话页（默认路由）：聊天流 + 首屏空状态 + 待决审批 + 输入区 + 检索浮层。
             批 C：聊天流与空状态共居滚动区（chat-empty 为流空时的居中欢迎卡）； -->
        <div id="chat-view">
          <div id="chat-scroll-area">
            <main id="stream" aria-live="polite"></main>
            <!-- 批 C 首屏空状态：流空时展示——欢迎卡 + 能力快捷入口
                （data-empty-action = 路由名 / input 聚焦输入框） -->
            <div id="chat-empty" aria-label="欢迎">
              <div class="welcome-card">
                <div class="welcome-mark">⬢</div>
                <h2 class="welcome-title">开始与 aegent 对话</h2>
                <p class="welcome-desc">让模型读写文件、跑命令、派子代理——写租约在手，改动随时在「工作台」评审。</p>
                <div class="welcome-actions">
                  <button type="button" class="btn btn-primary" data-empty-action="input">✦ 开始输入</button>
                  <button type="button" class="btn" data-empty-action="settings">⚙ 配置供应商</button>
                  <button type="button" class="btn" data-empty-action="history">🕘 会话历史</button>
                  <button type="button" class="btn" data-empty-action="search">🔍 跨会话搜索</button>
                </div>
              </div>
            </div>
          </div>
          <!-- U9/T-P3-108 会话内搜索条：渲染层文本检索——命中高亮 + 上下跳转 -->
          <div id="find-bar" hidden>
            <input id="find-input" type="text" placeholder="会话内搜索…" autocomplete="off" />
            <span id="find-count"></span>
            <button id="find-prev" type="button" title="上一处（Shift+Enter）">↑</button>
            <button id="find-next" type="button" title="下一处（Enter）">↓</button>
            <button id="find-close" type="button" title="关闭（Esc）">✕</button>
          </div>
          <!-- U9/T-P3-108 小地图：消息类型着色条 + 点击跳轮（纯 DOM） -->
          <div id="minimap" aria-label="会话结构导航"></div>
          <section id="pending" aria-label="待决审批"></section>
          <footer id="composer">
            <!-- U10/T-P3-109：补全下拉（@ 文件/目录、/ 命令+工具+技能）；批 C
                 起输入面收进 rounded-2xl 容器（ChatPromptEditor 形态——容器
                 focus 焦点环，🎤 与发送钮入容器底行） -->
            <div id="autocomplete" hidden></div>
            <div class="composer-box">
              <div id="attachments-preview"></div>
              <textarea id="prompt-input" rows="1" placeholder="输入指令回车执行…（Shift+Enter 换行；@ 补全文件、/ 补全命令）" autocomplete="off"></textarea>
              <div class="composer-actions">
                <button id="mic-btn" type="button" title="语音输入【实验性】（点击开始/再点结束）">🎤</button>
                <span class="composer-hint">Shift+Enter 换行</span>
                <button id="send-btn" type="button">发送</button>
              </div>
            </div>
          </footer>
        </div>
        <!-- 路由容器：views/*.js 页面模块挂载点（settings/usage/work/notify/history/search） -->
        <div id="view-root" hidden></div>
      </div>
    </div>

    <!-- 浮层（全路由共用）：Toast / 恢复横幅 / 更新横幅 + 发布说明 / 首次引导
         ——U13/T-P3-112 五件套的横幅与弹窗面（通知中心已迁 views/notify.js） -->
    <div id="toast-area" aria-live="polite"></div>
    <div id="recovery-banner" hidden>
      <span id="recovery-text"></span>
      <button id="recovery-retry" type="button">↻ 重试上一条</button>
      <button id="recovery-dismiss" type="button">知道了</button>
    </div>
    <div id="update-banner" hidden>
      <span id="update-text"></span>
      <button id="update-details" type="button">查看发布说明</button>
      <button id="update-dismiss" type="button">稍后</button>
    </div>
    <div id="onboarding" hidden>
      <div class="ob-card">
        <h2>欢迎使用 aegent</h2>
        <p class="hint">四步上手（不挡路——可随时在设置里回看）：</p>
        <ul id="ob-list">
          <li>⚙ <b>设置中心</b>——供应商/凭据/沙箱档即改即存（左侧栏 ⚙ 设置）</li>
          <li>⌨ <b>输入区</b>——@ 补全文件、/ 补全命令，Shift+Enter 换行，可粘贴图片</li>
          <li>🔍 <b>检索</b>——Ctrl+F 会话内搜索，侧栏 🔍 跨会话搜索</li>
          <li>📊 <b>用量</b>——上下文余量与成本随时可查（左侧栏 用量）</li>
        </ul>
        <button id="ob-done" type="button">开始使用</button>
      </div>
    </div>
    <div id="release-notes" hidden>
      <div class="ob-card">
        <h2 id="rn-version"></h2>
        <pre id="rn-body" class="card-args"></pre>
        <button id="rn-close" type="button">关闭</button>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
