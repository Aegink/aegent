<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aegent</title>
    <!-- T-P3-134 批 A：theme.css 由 style.css 头部 @import 引入（全站唯一取色处）；
         components.css = 组件类库（方案 §2.5 形态目录） -->
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
  </head>
  <body>
    <!-- T-P3-156 布局批骨架（方案 A/B/C）：三栏壳 = 项目侧栏（两分段：项目 /
         最近会话）+ 主列（顶栏 + 会话作业区 / 路由容器 + 右侧面板宿主 + 底部
         终端抽屉位）。需求映射：侧栏仅项目列表（一.1）、右侧大块=会话作业区
         （一.2）、右上角终端/切换面板常驻入口（一.4）、设置页无项目侧栏（一.3，
         router 加 settings-mode 类）。原 8 项导航去向：对话→主区恒在 / 历史→
         侧栏「最近会话」分段 / 项目→侧栏本体 / 搜索→侧栏顶动作行（Ctrl+Shift+F
         深链保留） / 工作台→面板宿主各 Tab（功能批/面板批迁入） / 插件·用量→
         设置页分节 / 通知→右上角铃铛 / 设置→独立页。 -->
    <div id="app-shell">
      <aside id="sidebar" aria-label="项目与会话">
        <header class="sidebar-head">
          <span class="sidebar-brand">aegent</span>
          <button id="sidebar-toggle" type="button" data-i18n-title="折叠/展开侧栏" title="折叠/展开侧栏">«</button>
        </header>
        <!-- 顶部动作行（pideck NewTaskButtonGroup 同位）：新建任务 + 跨会话搜索 -->
        <div class="sidebar-actions">
          <button id="sb-new-task" class="sb-action sb-action-primary" type="button" title="新建任务（选择项目并设为活动工作区）">
            <span data-icon="chat"></span><span class="nav-label">新建任务</span>
          </button>
          <button id="sb-search" class="sb-action" type="button" data-route="search" data-i18n-title="跨会话搜索（Ctrl+Shift+F）" title="跨会话搜索（Ctrl+Shift+F）">
            <span data-icon="search"></span>
          </button>
        </div>
        <!-- 两分段容器：项目 / 最近会话（ui/sidebar.js 渲染；文件树 = 侧栏
             滑入层——与两分段互斥，zcode WorkspaceSidebar 同款 translate 动画） -->
        <nav class="sidebar-body" id="sidebar-body">
          <div id="sb-projects" class="sidebar-section" aria-label="项目"></div>
          <div id="sb-history" class="sidebar-section" aria-label="最近会话"></div>
          <div id="sb-files" class="sidebar-section sb-files-layer" aria-label="文件树" hidden></div>
        </nav>
        <div class="sidebar-foot">
          <select id="profile-quick" data-i18n-title="场景快速切换（Profiles）" title="场景快速切换（Profiles）" hidden></select>
          <div class="foot-status">
            <span id="conn-status">连接中…</span>
            <span id="surface-id"></span>
            <span id="lease-status"></span>
          </div>
          <div class="foot-actions">
            <button id="lease-btn" type="button" data-i18n="取得写租约" title="获得向工作区写入的权限（同一时间只有一个界面持有）" hidden>取得写租约</button>
            <button id="work-btn" class="nav-item" type="button" data-route="work" data-i18n-title="工作台（文件/变更评审/子代理/协作）" title="工作台（文件/变更评审/子代理/协作）">
              <span data-icon="work"></span><span class="nav-label" data-i18n="工作台">工作台</span>
            </button>
            <button id="settings-btn" class="nav-item" type="button" data-route="settings" data-i18n-title="设置中心（Ctrl+,）" title="设置中心（Ctrl+,）">
              <span data-icon="settings"></span><span class="nav-label" data-i18n="设置">设置</span>
            </button>
          </div>
          <span class="foot-version">aegent v0.1.0</span>
        </div>
      </aside>
      <div class="sidebar-resizer" id="sidebar-resizer" title="拖拽调整侧栏宽度（双击重置）"></div>
      <div id="main">
        <!-- 顶栏：左 = 会话上下文（活动项目/任务名）；右 = 进度弹窗挂点 +
             通知 + 终端 + 切换面板（需求一.4/一.5——终端钮随面板批 P 接入显示） -->
        <header id="topbar">
          <div id="topbar-context" class="topbar-context" aria-label="当前工作区"></div>
          <div class="topbar-actions">
            <div id="progress-dock" aria-label="任务进度"></div>
            <button id="notify-top-btn" class="topbar-btn" type="button" data-route="notify" data-i18n-title="通知中心（Ctrl+B）" title="通知中心（Ctrl+B）">
              <span data-icon="bell"></span><span id="notify-badge" class="nav-badge" hidden></span>
            </button>
            <button id="terminal-btn" class="topbar-btn" type="button" data-i18n-title="终端" title="终端" hidden>
              <span data-icon="work"></span><span class="topbar-btn-label">终端</span>
            </button>
            <button id="pane-toggle-btn" class="topbar-btn" type="button" data-i18n-title="切换面板" title="切换面板">
              <span data-icon="work"></span><span class="topbar-btn-label">切换面板</span>
            </button>
          </div>
        </header>
        <div id="main-columns">
          <!-- 对话页（默认且恒在的会话作业区）：聊天流 + 首屏空状态 + 待决审批 +
               输入区 + 检索浮层。批 C：聊天流与空状态共居滚动区。 -->
          <div id="chat-view">
            <div id="chat-scroll-area">
              <main id="stream" aria-live="polite"></main>
              <!-- 批 C 首屏空状态：流空时展示——欢迎卡 + 能力快捷入口 -->
              <div id="chat-empty" aria-label="欢迎">
                <div class="welcome-card">
                  <div class="welcome-mark" data-icon="hexagon" data-icon-size="28"></div>
                  <h2 class="welcome-title">开始与 aegent 对话</h2>
                  <p class="welcome-desc">把一个项目交给 aegent：它会读写文件、跑命令，并给出可逐条评审的改动——右侧面板随时打开查看。</p>
                  <div class="welcome-actions">
                    <button type="button" class="btn btn-primary" data-empty-action="input"><span data-icon="sparkles" data-icon-size="14"></span> 开始输入</button>
                    <button type="button" class="btn" data-empty-action="settings"><span data-icon="settings" data-icon-size="14"></span> 配置供应商</button>
                    <button type="button" class="btn" data-empty-action="search"><span data-icon="search" data-icon-size="14"></span> 跨会话搜索</button>
                    <button type="button" class="btn" data-empty-action="usage"><span data-icon="usage" data-icon-size="14"></span> 用量统计</button>
                  </div>
                </div>
              </div>
            </div>
            <!-- U9/T-P3-108 会话内搜索条：渲染层文本检索——命中高亮 + 上下跳转 -->
            <div id="find-bar" hidden>
              <input id="find-input" class="input" type="text" placeholder="会话内搜索…" autocomplete="off" />
              <span id="find-count"></span>
              <button id="find-prev" type="button" title="上一处（Shift+Enter）"><span data-icon="chevronUp" data-icon-size="14"></span></button>
              <button id="find-next" type="button" title="下一处（Enter）"><span data-icon="chevronDown" data-icon-size="14"></span></button>
              <button id="find-close" type="button" title="关闭（Esc）"><span data-icon="close" data-icon-size="14"></span></button>
            </div>
            <!-- T-P3-160 需求 1：会话流左侧目录（zcode ConversationTurnNavigator
                 同构——每条用户消息一根指示条，悬停预览、点击跳转） -->
            <nav id="turn-nav" aria-label="会话目录" hidden></nav>
            <section id="pending" aria-label="待决审批"></section>
            <footer id="composer">
              <!-- U10/T-P3-109：补全下拉（@ 文件/目录、/ 命令+工具+技能） -->
              <div id="autocomplete" hidden></div>
              <!-- T-P3-156 K：排队"等待中"条（内核忙时发送自动入队——queue.ts；
                   停止 = cancel；立即发送 = steer 注入在途轮） -->
              <div id="queue-bar" hidden></div>
              <div class="composer-box">
                <div id="attachments-preview"></div>
                <textarea id="prompt-input" rows="1" placeholder="输入指令回车执行…（Shift+Enter 换行；@ 补全文件、/ 补全命令）" autocomplete="off"></textarea>
                <div class="composer-actions">
                  <div class="composer-tabs" id="composer-tabs">
                <input id="attach-file-input" type="file" multiple hidden />
                <button id="attach-add-btn" class="composer-tab" type="button" title="添加附件（任何文件；图片需当前模型可识别）"><span data-icon="paperclip" data-icon-size="14"></span> 附件</button>
                <button id="perm-pill" class="composer-tab" type="button" title="权限档（当前会话即时生效——config/refresh）"><span data-icon="lock" data-icon-size="14"></span> 权限</button>
                <button id="ctx-pill" class="composer-tab" type="button" title="上下文用量（点击看明细）"><span data-icon="gauge" data-icon-size="14"></span> 0%</button>
                <button id="model-pill" class="composer-tab" type="button" title="切换供应商与模型（model/switch）"><span data-icon="sparkles" data-icon-size="14"></span> 模型</button>
              </div>
                  <div class="composer-actions-right">
                  <div id="voice-status" hidden aria-live="polite">
                    <span class="voice-busy"><span data-icon="loader" data-icon-size="14" data-icon-class="icon-spin"></span> 转写中…</span>
                    <span class="voice-live">
                      <span class="voice-dot" aria-hidden="true"></span>
                      <span id="voice-timer">00:00</span>
                      <span id="voice-meter" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
                      <button id="voice-cancel" type="button" title="取消录音（Esc）"><span data-icon="close" data-icon-size="14"></span></button>
                    </span>
                  </div>
                  <button id="chat-export-btn" type="button" title="导出当前会话（md/html/json，默认脱敏密钥）"><span data-icon="download" data-icon-size="14"></span></button>
                  <button id="mic-btn" type="button" title="语音输入（实验性——点击开始/再点结束；Esc 取消）"><span data-icon="mic" data-icon-size="14"></span></button>
                  <button id="polish-btn" type="button" title="一键润色（辅助模型把草稿改写得更清晰）"><span data-icon="sparkles" data-icon-size="14"></span></button>
                  <span id="polish-undo" hidden><button type="button" id="polish-undo-btn">撤销润色</button></span>
                  <span class="composer-hint">Shift+Enter 换行</span>
                  <button id="send-btn" type="button">发送</button>
                  </div>
                </div>
              </div>
              <!-- T-P3-156 L：输入 Tab 栏（需求四——附件+/权限档/上下文%/模型
                   常驻可见；选择走 op 与 config/refresh、model/switch 既有面） -->
            </footer>
          </div>
          <!-- 路由容器：views/*.js 页面模块挂载点（settings/notify/search；工作台
               等旧 route 保留深链兼容，随功能批/面板批迁入面板后重定向） -->
          <div id="view-root" hidden></div>
          <!-- 右侧面板宿主（方案 C）：与「查看文件」同一位置 Tab 化——内置
               文件/审查/浏览器/辅助对话/Git/子代理 + 插件贡献（ui/pane.js） -->
          <aside id="pane-root" hidden aria-label="切换面板"></aside>
        </div>
        <!-- 底部终端抽屉（方案 P 容器——面板批接入 xterm.js 内容体） -->
        <footer id="terminal-drawer" hidden></footer>
      </div>
    </div>

    <!-- 浮层（全路由共用）：Toast / 恢复横幅 / 更新横幅 + 发布说明 / 首次引导
         ——U13/T-P3-112 五件套的横幅与弹窗面（通知中心已迁 views/notify.js） -->
    <div id="toast-area" aria-live="polite"></div>
    <div id="recovery-banner" hidden>
      <span id="recovery-text"></span>
      <button id="recovery-retry" type="button"><span data-icon="retry" data-icon-size="14"></span> 重试上一条</button>
      <button id="recovery-dismiss" type="button">知道了</button>
    </div>
    <div id="update-banner" hidden>
      <span id="update-text"></span>
      <button id="update-details" type="button">查看发布说明</button>
      <button id="update-dismiss" type="button">稍后</button>
    </div>
    <div id="release-notes" hidden>
      <div class="ob-card">
        <h2 id="rn-version"></h2>
        <pre id="rn-body" class="card-args"></pre>
        <button id="rn-close" type="button">关闭</button>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
