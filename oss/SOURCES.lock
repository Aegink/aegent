## 许可分级（决定能否摘代码）

- **MIT / Apache-2.0 / BSD** → 可参考实现，摘代码须保留版权头并登记 `THIRD_PARTY.md`
- **LGPL** → 可链接调用；若修改库本身并分发，须回馈修改
- **GPL / AGPL** → 只学行为，**不摘代码**（传染性）
- **PROPRIETARY / NO-LICENSE** → 只读行为与文档，**不摘代码**
