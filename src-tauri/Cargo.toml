[package]
name = "aegent-desktop"
version = "0.1.0"
description = "aegent 桌面壳（K2）——Tauri 2 最小壳，内核在 Node（host 进程），WebView 加载 ui/ 静态资产"
authors = ["wangh"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aegent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# T-P3-156 Q：浏览器面板需要主窗内 child Webview（真实内核）——multiwebview
# 属 unstable 面（tauri 官方标 unstable 的 multi-webview API）
tauri = { version = "2", features = ["unstable", "tray-icon"] }
# U7/T-P3-114：updater 单插件入册（九插件群不取的解禁例外——签名校验链）
tauri-plugin-updater = "2"
# T-P3-158 反馈 2：系统文件夹选择器（自定义 pick_folder command——不加
# dialog 插件，"九插件群不取"纪律；rfd 是 dialog 插件的同款底层）
rfd = "0.15"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
