[package]
name = "aegent-desktop"
version = "0.1.0"
description = "aegent 桌面壳（K2）——Tauri 2 最小壳，内核在 Node（host 进程），WebView 加载 ui/ 静态资产"
authors = ["wangh"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aegent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
